services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: att
      POSTGRES_PASSWORD: att
      POSTGRES_DB: attendance
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    command: ["redis-server", "--requirepass", "devpass"]
    ports:
      - "6379:6379"

volumes:
  pgdata: