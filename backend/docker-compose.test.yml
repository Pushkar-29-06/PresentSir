services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: test_att
      POSTGRES_PASSWORD: test_att
      POSTGRES_DB: attendance_test
    ports:
      - "55432:5432"
    tmpfs:
      - /var/lib/postgresql/data

  redis:
    image: redis:7
    command: ["redis-server", "--requirepass", "testpass"]
    ports:
      - "56379:6379"
